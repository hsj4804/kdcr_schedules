<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현장투입 및 일정관리 시스템</title>
  
  <!-- Firebase SDK Compat 버전 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #f8f9fa;
      --border-color: #dee2e6;
      --header-bg: #f1f3f5;
      --sticky-left-bg: #ffffff;
      --primary-color: #1971c2;
      --danger-color: #fa5252;
      
      /* 주말 및 공휴일 색상 */
      --weekend-bg: #f1f3f5;
      --holiday-bg: #fff0f6;
      --holiday-border: #f783ac;
      --holiday-text: #e64980;
      
      /* 오늘 하이라이트 */
      --today-bg: #e6fcf5;
      --today-header-bg: #c3fae8;
      --today-border: #20c997;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { padding: 20px; background-color: var(--bg-color); color: #333; }

    /* 상태 바 */
    .status-bar {
      background: #e7f5ff;
      border: 1px solid #a5d8ff;
      color: #1971c2;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: #40c057; display: inline-block; }

    /* 메인 타이틀 & 컨트롤 */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .main-title-box h1 { font-size: 22px; font-weight: 800; color: #1c7ed6; }
    .month-picker { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .month-picker h2 { font-size: 18px; font-weight: 700; min-width: 130px; text-align: center; }
    
    .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    
    .btn {
      padding: 8px 14px;
      border: 1px solid #ced4da;
      background-color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn:hover:not(:disabled) { background-color: #e9ecef; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background-color: var(--primary-color); color: white; border: none; }
    .btn-primary:hover:not(:disabled) { background-color: #1864ab; }
    .btn-sm { padding: 4px 8px; font-size: 11px; }
    .btn-danger { background-color: var(--danger-color); color: white; border: none; }
    .btn-danger:hover:not(:disabled) { background-color: #e03131; }

    /* 섹션 레이아웃 (외업 / 내업) */
    .section-container {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-outdoor { background: #e7f5ff; color: #1971c2; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; }
    .badge-indoor { background: #f3f0ff; color: #6741d9; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; }

    /* 테이블 스타일 */
    .timeline-wrapper { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 1250px; table-layout: fixed; }
    th, td { border: 1px solid var(--border-color); text-align: center; font-size: 12px; height: 38px; }
    
    .col-resource { width: 120px; min-width: 120px; position: sticky; left: 0; background: var(--sticky-left-bg); z-index: 10; border-right: 2px solid #adb5bd; }
    th.col-resource { z-index: 20; background: var(--header-bg); font-weight: 700; }
    
    th.day-header { background: var(--header-bg); font-weight: 600; padding: 2px; }
    th.day-header .day-num { font-size: 12px; }
    th.day-header .day-name { font-size: 10px; color: #868e96; }
    th.day-header .holiday-name { font-size: 9px; color: var(--holiday-text); font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 주말 & 공휴일 & 당일 색상 */
    .weekend-cell { background-color: var(--weekend-bg); }
    .sat-header { color: #1c7ed6; }
    .sun-header { color: #f03e3e; }

    .holiday-cell { background-color: var(--holiday-bg) !important; }
    .holiday-header { background-color: #ffe3ec !important; color: var(--holiday-text) !important; font-weight: 700; }

    th.today-col { background-color: var(--today-header-bg) !important; color: #0ca678 !important; border-left: 2px solid var(--today-border) !important; border-right: 2px solid var(--today-border) !important; }
    td.today-col { background-color: var(--today-bg) !important; border-left: 2px solid var(--today-border) !important; border-right: 2px solid var(--today-border) !important; }

    /* 타임라인 바 연속형 렌더링 스타일 */
    .cell-day { padding: 0; position: relative; cursor: pointer; }
    .cell-day:hover { filter: brightness(0.96); }
    
    .allocation-bar {
      height: 30px;
      margin: 4px 0;
      color: white;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      padding: 0 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
      user-select: none;
      position: relative;
      cursor: pointer;
    }
    .bar-start { border-top-left-radius: 4px; border-bottom-left-radius: 4px; margin-left: 2px; }
    .bar-end { border-top-right-radius: 4px; border-bottom-right-radius: 4px; margin-right: 2px; }
    .bar-middle { border-radius: 0; }
    
    /* 연속 텍스트가 바깥으로 이어지며 보이도록 처리 */
    .bar-text-wrapper {
      position: absolute;
      left: 6px;
      top: 0;
      height: 100%;
      display: flex;
      align-items: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
    }

    /* 범례 및 외업/내업 분리 상세 공수 */
    .legend-container {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .legend-title { font-weight: 700; font-size: 15px; color: #343a40; margin-bottom: 14px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .legend-grid { display: flex; flex-direction: column; gap: 12px; }
    .legend-card {
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e9ecef;
      padding: 12px 16px;
    }
    .legend-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .color-badge { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    .proj-code-tag { background: #e9ecef; color: #495057; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
    
    .legend-split-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
      font-size: 12px;
    }
    @media (max-width: 768px) {
      .legend-split-box { grid-template-columns: 1fr; }
    }
    .split-col { display: flex; flex-direction: column; gap: 4px; }
    .split-title { font-weight: 700; font-size: 11px; display: flex; align-items: center; gap: 6px; }
    .split-items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .sub-pill { background: #f8f9fa; border: 1px solid #ced4da; padding: 2px 8px; border-radius: 10px; font-size: 11px; }

    /* 모달 */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal {
      background: white;
      padding: 24px;
      border-radius: 8px;
      width: 480px;
      max-width: 92%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
    .modal h3 { margin-bottom: 16px; font-size: 18px; border-bottom: 2px solid #f1f3f5; padding-bottom: 8px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #495057; }
    .form-group select, .form-group input[type="text"], .form-group input[type="date"] {
      width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    /* 20색 전용 팔레트 그리드 */
    .color-palette-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .palette-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }
    .palette-circle:hover { transform: scale(1.15); }
    .palette-circle.active { border-color: #212529; box-shadow: 0 0 0 2px rgba(0,0,0,0.2); }

    .manage-section { margin-bottom: 24px; }
    .manage-section h4 { font-size: 14px; color: #495057; margin-bottom: 8px; }
    .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .item-list { list-style: none; border: 1px solid #e9ecef; border-radius: 4px; max-height: 200px; overflow-y: auto; }
    .item-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #e9ecef; font-size: 13px; }
    .item-list li:last-child { border-bottom: none; }
    .item-info { display: flex; align-items: center; gap: 8px; }
    .item-actions { display: flex; gap: 4px; }
  </style>
</head>
<body>

  <!-- 상태 바 -->

      },
      "2027": {
        "01-01": "신정", "02-06": "설날연휴", "02-07": "설날", "02-08": "설날연휴",
        "02-09": "대체공휴일", "03-01": "삼일절", "05-05": "어린이날", "05-13": "부처님오신날",
        "06-06": "현충일", "06-07": "대체공휴일", "08-15": "광복절", "08-16": "대체공휴일",
        "09-14": "추석연휴", "09-15": "추석", "09-16": "추석연휴", "10-03": "개천절",
        "10-04": "대체공휴일", "10-09": "한글날", "10-11": "대체공휴일", "12-25": "성탄절"
      }
    };

    let holidaysCache = {};

    async function loadHolidays(year) {
      if (holidaysCache[year]) return holidaysCache[year];
      const data = officialHolidays[String(year)] || {};
      holidaysCache[year] = data;
      return data;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      buildPaletteUI('newProjectPalette', (color) => { selectedNewProjectColor = color; }, selectedNewProjectColor);
      await loadHolidays(viewYear);
      initRealtimeSync();
      render();
    });

    // -----------------------------------------------------------------
    // 4. Firebase 실시간 동기화
    // -----------------------------------------------------------------
    function initRealtimeSync() {
      if (!db || firebaseConfig.apiKey === "YOUR_API_KEY") {
        document.getElementById('statusDot').style.background = '#fa5252';
        document.getElementById('statusText').textContent = '⚠️ Firebase 설정 정보가 입력되지 않았습니다. (스코드 내 firebaseConfig 수정 필요)';
        return;
      }

      db.ref('siteScheduleData').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          resources = data.resources || [];
          projects = data.projects || [];
          allocations = data.allocations || [];
          ensureProjectCodes(); // 번호 무결성 검증
        } else {
          ensureProjectCodes();
          saveToFirebase();
        }

        document.getElementById('statusDot').style.background = '#40c057';
        document.getElementById('statusText').textContent = '🟢 실시간 클라우드 연결됨 (동시 편집 활성화)';
        render();
      }, (error) => {
        document.getElementById('statusDot').style.background = '#fa5252';
        document.getElementById('statusText').textContent = '🔴 클라우드 동기화 실패: ' + error.message;
      });
    }

    function saveToFirebase() {
      if (db && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        db.ref('siteScheduleData').set({
          resources: resources,
          projects: projects,
          allocations: allocations
        });
      }
    }

    // 프로젝트 자동 코드(P01, P02...) 동기화
    function ensureProjectCodes() {
      projects.forEach((p, idx) => {
        p.code = `P${String(idx + 1).padStart(2, '0')}`;
      });
    }

    // -----------------------------------------------------------------
    // 5. UI 랜더링 (연속 텍스트 및 외업/내업 테이블)
    // -----------------------------------------------------------------
    async function render() {
      document.getElementById('currentMonthTitle').textContent = `${viewYear}년 ${viewMonth}월`;
      const totalDays = new Date(viewYear, viewMonth, 0).getDate();
      const holidays = await loadHolidays(viewYear);

      renderTableHeaders('outdoor', totalDays, holidays);
      renderTableHeaders('indoor', totalDays, holidays);

      renderTableBody('outdoor', totalDays, holidays, 'OUTDOOR');
      renderTableBody('indoor', totalDays, holidays, 'INDOOR');

      renderLegend(totalDays);
    }

    function renderTableHeaders(prefix, totalDays, holidays) {
      const dateRow = document.getElementById(`${prefix}DateRow`);
      const dayRow = document.getElementById(`${prefix}DayRow`);

      while (dateRow.children.length > 1) dateRow.removeChild(dateRow.lastChild);
      dayRow.innerHTML = '';

      for (let day = 1; day <= totalDays; day++) {
        const dateObj = new Date(viewYear, viewMonth - 1, day);
        const dayOfWeek = dateObj.getDay();
        const dateStr = formatDate(viewYear, viewMonth, day);
        const mdKey = dateStr.substring(5);
        const holidayName = holidays[mdKey] || null;

        const isToday = (viewYear === todayYear && viewMonth === todayMonth && day === todayDay);

        const thDate = document.createElement('th');
        thDate.className = 'day-header';
        if (dayOfWeek === 6) thDate.classList.add('sat-header');
        if (dayOfWeek === 0) thDate.classList.add('sun-header');
        if (holidayName) thDate.classList.add('holiday-header');
        if (isToday) thDate.classList.add('today-col');

        thDate.innerHTML = `
          <div class="day-num">${day}</div>
          ${holidayName ? `<div class="holiday-name" title="${holidayName}">${holidayName}</div>` : ''}
        `;
        dateRow.appendChild(thDate);

        const thDay = document.createElement('th');
        thDay.className = 'day-header';
        if (dayOfWeek === 6) thDay.classList.add('sat-header');
        if (dayOfWeek === 0) thDay.classList.add('sun-header');
        if (holidayName) thDay.classList.add('holiday-header');
        if (isToday) thDay.classList.add('today-col');

        thDay.innerHTML = `<div class="day-name">${dayNames[dayOfWeek]}</div>`;
        dayRow.appendChild(thDay);
      }
    }

    function renderTableBody(prefix, totalDays, holidays, workType) {
      const tbody = document.getElementById(`${prefix}Body`);
      tbody.innerHTML = '';

      resources.forEach(res => {
        const tr = document.createElement('tr');
        
        const tdName = document.createElement('td');
        tdName.className = 'col-resource';
        tdName.style.fontWeight = '600';
        tdName.textContent = res.name;
        tr.appendChild(tdName);

        for (let day = 1; day <= totalDays; day++) {
          const td = document.createElement('td');
          td.className = 'cell-day';
          const currentDateStr = formatDate(viewYear, viewMonth, day);
          const dateObj = new Date(viewYear, viewMonth - 1, day);
          const dayOfWeek = dateObj.getDay();
          const mdKey = currentDateStr.substring(5);
          const holidayName = holidays[mdKey] || null;

          if (dayOfWeek === 0 || dayOfWeek === 6) td.classList.add('weekend-cell');
          if (holidayName) td.classList.add('holiday-cell');
          if (viewYear === todayYear && viewMonth === todayMonth && day === todayDay) td.classList.add('today-col');

          td.onclick = () => {
            openAllocationModal(null, res.id, currentDateStr, workType);
          };

          const activeAlloc = allocations.find(a => 
            a.resourceId === res.id &&
            a.type === workType &&
            currentDateStr >= a.startDate &&
            currentDateStr <= a.endDate
          );

          if (activeAlloc) {
            const project = projects.find(p => p.id === activeAlloc.projectId);
            if (project) {
              const bar = document.createElement('div');
              bar.className = 'allocation-bar';
              bar.style.backgroundColor = project.color;

              const isStart = (currentDateStr === activeAlloc.startDate);
              const isEnd = (currentDateStr === activeAlloc.endDate);

              if (isStart) bar.classList.add('bar-start');
              if (isEnd) bar.classList.add('bar-end');
              if (!isStart && !isEnd) bar.classList.add('bar-middle');

              // 연속된 텍스트가 바 전체에 걸쳐 보이도록 시작 셀 또는 월초 셀에 텍스트 래퍼 추가
              if (isStart || day === 1) {
                const textWrapper = document.createElement('div');
                textWrapper.className = 'bar-text-wrapper';
                textWrapper.textContent = `[${project.code}] ${project.name}`;
                bar.appendChild(textWrapper);
              }

              bar.title = `[${workType === 'OUTDOOR' ? '외업' : '내업'}] [${project.code}] ${project.name} (${activeAlloc.startDate} ~ ${activeAlloc.endDate})\n클릭 시 수정/삭제`;

              bar.onclick = (e) => {
                e.stopPropagation();
                openAllocationModal(activeAlloc.id);
              };

              td.appendChild(bar);
            }
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
    }

    // -----------------------------------------------------------------
    // 6. 하단 범례: 외업/내업 분리 집계
    // -----------------------------------------------------------------
    function renderLegend(totalDays) {
      const legendGrid = document.getElementById('legendGrid');
      legendGrid.innerHTML = '';

      const monthStart = formatDate(viewYear, viewMonth, 1);
      const monthEnd = formatDate(viewYear, viewMonth, totalDays);

      projects.forEach(p => {
        let outdoorTotal = 0;
        let indoorTotal = 0;
        const outdoorResMap = {};
        const indoorResMap = {};

        allocations.filter(a => a.projectId === p.id).forEach(a => {
          const start = a.startDate < monthStart ? monthStart : a.startDate;
          const end = a.endDate > monthEnd ? monthEnd : a.endDate;
          
          if (start <= end) {
            const sDate = new Date(start);
            const eDate = new Date(end);
            const diffDays = Math.round((eDate - sDate) / (1000 * 60 * 60 * 24)) + 1;

            if (a.type === 'INDOOR') {
              indoorTotal += diffDays;
              indoorResMap[a.resourceId] = (indoorResMap[a.resourceId] || 0) + diffDays;
            } else {
              outdoorTotal += diffDays;
              outdoorResMap[a.resourceId] = (outdoorResMap[a.resourceId] || 0) + diffDays;
            }
          }
        });

        const outdoorPills = Object.keys(outdoorResMap).map(rId => {
          const rName = resources.find(r => r.id === rId)?.name || "미지정";
          return `<span class="sub-pill">${rName}: <b>${outdoorResMap[rId]} M/D</b></span>`;
        }).join('') || '<span style="color:#adb5bd; font-size:11px;">외업 투입 없음</span>';

        const indoorPills = Object.keys(indoorResMap).map(rId => {
          const rName = resources.find(r => r.id === rId)?.name || "미지정";
          return `<span class="sub-pill">${rName}: <b>${indoorResMap[rId]} M/D</b></span>`;
        }).join('') || '<span style="color:#adb5bd; font-size:11px;">내업 투입 없음</span>';

        const card = document.createElement('div');
        card.className = 'legend-card';
        card.innerHTML = `
          <div class="legend-card-header">
            <span class="proj-code-tag">${p.code}</span>
            <div class="color-badge" style="background-color: ${p.color};"></div>
            <span>${p.name}</span>
            <span style="color:#1971c2; font-size:12px; margin-left:auto;">총 합계: ${outdoorTotal + indoorTotal} M/D</span>
          </div>
          <div class="legend-split-box">
            <div class="split-col">
              <div class="split-title"><span class="badge-outdoor">외업</span> 외업 합계: <b>${outdoorTotal} M/D</b></div>
              <div class="split-items">${outdoorPills}</div>
            </div>
            <div class="split-col">
              <div class="split-title"><span class="badge-indoor">내업</span> 내업 합계: <b>${indoorTotal} M/D</b></div>
              <div class="split-items">${indoorPills}</div>
            </div>
          </div>
        `;
        legendGrid.appendChild(card);
      });
    }

    // -----------------------------------------------------------------
    // 7. 모달 및 일정 CRUD (중복 방지 포함)
    // -----------------------------------------------------------------
    function openAllocationModal(allocId = null, resourceId = null, dateStr = null, defaultWorkType = 'OUTDOOR') {
      if (resources.length === 0 || projects.length === 0) {
        alert('먼저 자원(인원)과 프로젝트를 등록해 주세요.');
        return;
      }

      const resSelect = document.getElementById('modalResource');
      resSelect.innerHTML = resources.map(r => `<option value="${r.id}">${r.name}</option>`).join('');

      const projSelect = document.getElementById('modalProject');
      projSelect.innerHTML = projects.map(p => `<option value="${p.id}">[${p.code}] ${p.name}</option>`).join('');

      const workTypeSelect = document.getElementById('modalWorkType');
      const deleteBtn = document.getElementById('btnDeleteAlloc');
      const modalTitle = document.getElementById('modalAllocTitle');

      if (allocId) {
        const alloc = allocations.find(a => a.id === allocId);
        if (!alloc) return;

        editingAllocId = allocId;
        modalTitle.textContent = "투입 일정 수정 및 삭제";
        deleteBtn.style.display = "inline-block";

        workTypeSelect.value = alloc.type || 'OUTDOOR';
        resSelect.value = alloc.resourceId;
        projSelect.value = alloc.projectId;
        document.getElementById('modalStartDate').value = alloc.startDate;
        document.getElementById('modalEndDate').value = alloc.endDate;
      } else {
        editingAllocId = null;
        modalTitle.textContent = "투입 일정 신규 등록";
        deleteBtn.style.display = "none";

        workTypeSelect.value = defaultWorkType;
        if (resourceId) resSelect.value = resourceId;
        document.getElementById('modalStartDate').value = dateStr || `${viewYear}-${String(viewMonth).padStart(2, '0')}-01`;
        document.getElementById('modalEndDate').value = dateStr || `${viewYear}-${String(viewMonth).padStart(2, '0')}-15`;
      }

      document.getElementById('allocModalBackdrop').style.display = 'flex';
    }

    function closeAllocModal() {
      document.getElementById('allocModalBackdrop').style.display = 'none';
      editingAllocId = null;
    }

    function saveAllocation() {
      const workType = document.getElementById('modalWorkType').value;
      const resId = document.getElementById('modalResource').value;
      const projId = document.getElementById('modalProject').value;
      const startDate = document.getElementById('modalStartDate').value;
      const endDate = document.getElementById('modalEndDate').value;

      if (!startDate || !endDate || startDate > endDate) {
        alert('올바른 시작일과 종료일을 입력해주세요.');
        return;
      }

      const hasConflict = allocations.some(a => {
        if (editingAllocId && a.id === editingAllocId) return false;
        if (a.resourceId !== resId) return false;
        return (startDate <= a.endDate) && (endDate >= a.startDate);
      });

      if (hasConflict) {
        const conflictRes = resources.find(r => r.id === resId)?.name || "해당 인원";
        alert(`[투입 불가 경고]\n${conflictRes} 님은 선택하신 기간(${startDate} ~ ${endDate})에 이미 외업 또는 내업 일정이 등록되어 있어 중복 투입할 수 없습니다.`);
        return;
      }

      if (editingAllocId) {
        const alloc = allocations.find(a => a.id === editingAllocId);
        if (alloc) {
          alloc.type = workType;
          alloc.resourceId = resId;
          alloc.projectId = projId;
          alloc.startDate = startDate;
          alloc.endDate = endDate;
        }
      } else {
        allocations.push({
          id: Date.now(),
          type: workType,
          resourceId: resId,
          projectId: projId,
          startDate,
          endDate
        });
      }

      saveToFirebase();
      closeAllocModal();
    }

    function deleteAllocation() {
      if (!editingAllocId) return;
      if (confirm('해당 투입 일정을 삭제하시겠습니까?')) {
        allocations = allocations.filter(a => a.id !== editingAllocId);
        saveToFirebase();
        closeAllocModal();
      }
    }

    // -----------------------------------------------------------------
    // 8. 20색 전용 팔레트 렌더러
    // -----------------------------------------------------------------
    function buildPaletteUI(containerId, onSelectCallback, defaultSelectedColor) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      DISTINCT_20_COLORS.forEach(color => {
        const circle = document.createElement('div');
        circle.className = 'palette-circle';
        circle.style.backgroundColor = color;
        if (color === defaultSelectedColor) circle.classList.add('active');

        circle.onclick = () => {
          Array.from(container.children).forEach(c => c.classList.remove('active'));
          circle.classList.add('active');
          onSelectCallback(color);
        };
        container.appendChild(circle);
      });
    }

    // -----------------------------------------------------------------
    // 9. 자원 및 프로젝트 관리 (자동 넘버링 및 순서 변경)
    // -----------------------------------------------------------------
    function openSettingsModal() {
      ensureProjectCodes();
      renderSettingsLists();
      document.getElementById('settingsModalBackdrop').style.display = 'flex';
    }

    function closeSettingsModal() {
      document.getElementById('settingsModalBackdrop').style.display = 'none';
      saveToFirebase();
    }

    function renderSettingsLists() {
      // 자원 리스트
      const resUI = document.getElementById('resourceListUI');
      resUI.innerHTML = resources.map((r, index) => `
        <li>
          <span>${r.name}</span>
          <div class="item-actions">
            <button class="btn btn-sm" onclick="moveResource(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▲</button>
            <button class="btn btn-sm" onclick="moveResource(${index}, 1)" ${index === resources.length - 1 ? 'disabled' : ''}>▼</button>
            <button class="btn btn-sm" onclick="editResource('${r.id}')">수정</button>
            <button class="btn btn-sm btn-danger" onclick="deleteResource('${r.id}')">삭제</button>
          </div>
        </li>
      `).join('');

      // 프로젝트 리스트 (자동 코드 표시 및 상하 이동)
      const projUI = document.getElementById('projectListUI');
      projUI.innerHTML = projects.map((p, index) => `
        <li>
          <div class="item-info">
            <span class="proj-code-tag">${p.code}</span>
            <span class="color-badge" style="background-color:${p.color}"></span>
            <span>${p.name}</span>
          </div>
          <div class="item-actions">
            <button class="btn btn-sm" onclick="moveProject(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▲</button>
            <button class="btn btn-sm" onclick="moveProject(${index}, 1)" ${index === projects.length - 1 ? 'disabled' : ''}>▼</button>
            <button class="btn btn-sm" onclick="openEditProjectModal('${p.id}')">수정</button>
            <button class="btn btn-sm btn-danger" onclick="deleteProject('${p.id}')">삭제</button>
          </div>
        </li>
      `).join('');
    }

    // 자원 순서 이동
    function moveResource(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= resources.length) return;
      const temp = resources[index];
      resources[index] = resources[targetIndex];
      resources[targetIndex] = temp;
      saveToFirebase();
      renderSettingsLists();
    }

    // 프로젝트 순서 이동 및 코드 재부여
    function moveProject(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= projects.length) return;
      const temp = projects[index];
      projects[index] = projects[targetIndex];
      projects[targetIndex] = temp;
      ensureProjectCodes();
      saveToFirebase();
      renderSettingsLists();
    }

    function addResource() {
      const input = document.getElementById('newResourceName');
      const name = input.value.trim();
      if (!name) return alert('자원 이름을 입력하세요.');
      resources.push({ id: 'r_' + Date.now(), name });
      input.value = '';
      saveToFirebase();
      renderSettingsLists();
    }

    function editResource(id) {
      const res = resources.find(r => r.id === id);
      if (!res) return;
      const newName = prompt('수정할 자원의 이름을 입력하세요:', res.name);
      if (newName && newName.trim() !== '') {
        res.name = newName.trim();
        saveToFirebase();
        renderSettingsLists();
      }
    }

    function deleteResource(id) {
      if (confirm('이 자원을 삭제하시겠습니까? 관련된 모든 일정도 함께 삭제됩니다.')) {
        resources = resources.filter(r => r.id !== id);
        allocations = allocations.filter(a => a.resourceId !== id);
        saveToFirebase();
        renderSettingsLists();
      }
    }

    function addProject() {
      const nameInput = document.getElementById('newProjectName');
      const name = nameInput.value.trim();
      if (!name) return alert('프로젝트명을 입력하세요.');

      projects.push({
        id: 'p_' + Date.now(),
        code: `P${String(projects.length + 1).padStart(2, '0')}`,
        name,
        color: selectedNewProjectColor
      });

      nameInput.value = '';
      saveToFirebase();
      renderSettingsLists();
    }

    // 프로젝트 수정 모달
    function openEditProjectModal(projId) {
      const proj = projects.find(p => p.id === projId);
      if (!proj) return;

      editingProjectId = projId;
      document.getElementById('editProjectName').value = proj.name;
      selectedEditProjectColor = proj.color || DISTINCT_20_COLORS[0];

      buildPaletteUI('editProjectPalette', (color) => {
        selectedEditProjectColor = color;
      }, selectedEditProjectColor);

      document.getElementById('editProjectModalBackdrop').style.display = 'flex';
    }

    function closeEditProjectModal() {
      document.getElementById('editProjectModalBackdrop').style.display = 'none';
      editingProjectId = null;
    }

    function saveEditedProject() {
      const proj = projects.find(p => p.id === editingProjectId);
      if (!proj) return;

      const newName = document.getElementById('editProjectName').value.trim();
      if (!newName) return alert('프로젝트명을 입력하세요.');

      proj.name = newName;
      proj.color = selectedEditProjectColor;

      saveToFirebase();
      closeEditProjectModal();
      renderSettingsLists();
    }

    function deleteProject(id) {
      if (confirm('이 프로젝트를 삭제하시겠습니까? 관련된 모든 일정도 함께 삭제됩니다.')) {
        projects = projects.filter(p => p.id !== id);
        allocations = allocations.filter(a => a.projectId !== id);
        ensureProjectCodes();
        saveToFirebase();
        renderSettingsLists();
      }
    }

    // -----------------------------------------------------------------
    // 10. 날짜 유틸리티
    // -----------------------------------------------------------------
    async function changeMonth(diff) {
      viewMonth += diff;
      if (viewMonth > 12) { viewYear++; viewMonth = 1; }
      if (viewMonth < 1) { viewYear--; viewMonth = 12; }
      await loadHolidays(viewYear);
      render();
    }

    function formatDate(year, month, day) {
      return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }
  </script>
</body>
</html>
